name: Audi A3 PHEV Battery (BLE OBD)
description: Reads HV battery SOC % and available energy from Audi A3/S3/RS3 PHEV via Bluetooth LE OBD-II (OBD2). No cloud, fully local.
version: "1.3.0"
slug: a3-odbd2-soc
url: https://github.com/jekkos/ha-addons
image: jekkos/a3-odbd2-soc
init: false
arch:
  - aarch64
  - amd64
startup: services
privileged:
  - NET_ADMIN
  - BLUETOOTH
host_network: true
devices:
  - /dev/btusb
ports: {}
options:
  ble_mac: "00:10:CC:4F:36:03"
  obd_pid: "5B"
  read_wait: 3.0
  read_retries: 3
  poll_interval: 300
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  net_usable_kwh: 12.4
schema:
  ble_mac: str
  obd_pid: str
  read_wait: float
  read_retries: int
  poll_interval: int
  mqtt_host: str
  mqtt_port: int
  mqtt_username: str
  mqtt_password: str
  net_usable_kwh: float
