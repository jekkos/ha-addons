name: Build and Publish Docker Images

on:
  push:
    branches: [master]
    paths:
      - 'a3-odbd2-soc/**'
      - 'deye-dummycloud-node/**'
      - 'solarmeter/**'
      - 's0pcm/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build-a3-odbd2-soc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push a3-odbd2-soc
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./a3-odbd2-soc/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            jekkos/a3-odbd2-soc:latest
            jekkos/a3-odbd2-soc:${{ github.sha }}

  build-deye-dummycloud-node:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push deye-dummycloud-node
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deye-dummycloud-node/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            jekkos/deye-dummycloud-node:latest
            jekkos/deye-dummycloud-node:${{ github.sha }}
