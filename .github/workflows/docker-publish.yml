name: Build and Publish Docker Images

on:
  push:
    branches: [master]
    paths:
      - 'a3-odbd2-soc/**'
      - 'deye-dummycloud-node/**'
      - 'solarmeter/**'
      - 's0pcm/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build-a3-odbd2-soc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(grep '^version:' a3-odbd2-soc/config.yaml | cut -d'"' -f2)" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push a3-odbd2-soc
        uses: docker/build-push-action@v5
        with:
          context: ./a3-odbd2-soc
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            jekkos/a3-odbd2-soc:${{ steps.version.outputs.version }}
            jekkos/a3-odbd2-soc:latest

  build-deye-dummycloud-node:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(grep '^version:' deye-dummycloud-node/config.yaml | cut -d'"' -f2)" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push deye-dummycloud-node
        uses: docker/build-push-action@v5
        with:
          context: ./deye-dummycloud-node
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            jekkos/deye-dummycloud-node:${{ steps.version.outputs.version }}
            jekkos/deye-dummycloud-node:latest

  build-s0pcm-reader:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(grep '^version:' s0pcm/config.yaml | cut -d'"' -f2)" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push s0pcm-reader
        uses: docker/build-push-action@v5
        with:
          context: ./s0pcm
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            jekkos/s0pcm-reader:${{ steps.version.outputs.version }}
            jekkos/s0pcm-reader:latest

  build-solarmeter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(grep '^version:' solarmeter/config.yaml | cut -d'"' -f2)" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push solarmeter
        uses: docker/build-push-action@v5
        with:
          context: ./solarmeter
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            jekkos/solarmeter:${{ steps.version.outputs.version }}
            jekkos/solarmeter:latest
