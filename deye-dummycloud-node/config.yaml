---
name: Deye Dummy Cloud (Node)
version: "1.3.1"
slug: deye-dummycloud-node
description: "Local replacement for the Deye/Solarman cloud: microinverter loggers push data over TCP, published to MQTT with HA auto-discovery"
icon: https://raw.githubusercontent.com/home-assistant/brands/master/custom_integrations/deye_cloud/icon.png
arch:
  - aarch64
  - amd64
init: false
startup: services
homeassistant: 2024.1.0
image: jekkos/deye-dummycloud-node
host_network: true
ports:
  10000/tcp: 10000
options:
  log_level: "info"
  mqtt_broker_url: "mqtt://core-mosquitto:1883"
  mqtt_username: ""
  mqtt_password: ""
  mqtt_check_cert: "false"
  topic_prefix: "deye-dummycloud"
schema:
  log_level: match(trace|debug|info|warn|error|fatal)
  mqtt_broker_url: str
  mqtt_username: str?
  mqtt_password: password?
  mqtt_check_cert: bool?
  topic_prefix: str
